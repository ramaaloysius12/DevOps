<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pengaturan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }</style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Pengaturan Akun</h2>
        
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <a href="/profile" class="flex items-center gap-4 p-5 border-b border-slate-100 hover:bg-slate-50 transition">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="user" class="w-5 h-5"></i></div>
                <div class="flex-1"><h4 class="font-semibold text-slate-800">Kartu Nama (ID Card)</h4></div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </a>
            <div class="flex items-center gap-4 p-5 border-b border-slate-100">
                <div class="p-3 bg-slate-50 text-slate-600 rounded-xl"><i data-lucide="moon" class="w-5 h-5"></i></div>
                <div class="flex-1"><h4 class="font-semibold text-slate-800">Dark Mode</h4></div>
                <div class="w-11 h-6 bg-slate-200 rounded-full border-2 border-transparent relative"><div class="w-5 h-5 bg-white rounded-full shadow"></div></div>
            </div>
            <button onclick="logout()" class="w-full flex items-center gap-4 p-5 hover:bg-rose-50 transition text-left">
                <div class="p-3 bg-rose-50 text-rose-600 rounded-xl"><i data-lucide="log-out" class="w-5 h-5"></i></div>
                <div class="flex-1"><h4 class="font-semibold text-rose-600">Keluar (Logout)</h4></div>
            </button>
        </div>
        
        <!-- INI YANG DIUBAH: onclick menjadi goToDashboard() -->
        <button onclick="goToDashboard()" class="w-full bg-slate-200 text-slate-700 font-semibold py-4 rounded-xl mt-6 hover:bg-slate-300 transition">
            Kembali ke Dashboard
        </button>
    </div>

    <script>
        lucide.createIcons();
        
        function logout() {
            if(confirm("Apakah Anda yakin ingin keluar?")) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_name');
                localStorage.removeItem('user_role');
                window.location.href = '/login';
            }
        }

        // --- TAMBAHAN BARU: Fungsi Pintar Cek Role ---
        function goToDashboard() {
            // Ambil role user dari memori browser
            const userRole = localStorage.getItem('user_role');
            
            // Jika role adalah 1 (HRD), maka pulang ke dashboard HRD
            if (userRole == 1) {
                window.location.href = '/dashboard-hrd';
            } 
            // Jika role bukan 1 (Karyawan biasa), maka pulang ke dashboard biasa
            else {
                window.location.href = '/dashboard';
            }
        }
    </script>
</body>
</html>
