<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS Premium - Presensi Kehadiran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md p-8 rounded-3xl glass-card shadow-2xl transition-all duration-300 transform">
        <!-- Header Gradient Premium -->
        <div class="rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 p-6 text-white mb-6 shadow-md">
            <h2 class="text-2xl font-bold tracking-tight">Presensi Digital</h2>
            <p class="text-sm text-blue-100 mt-1">Pastikan Anda berada di area jangkauan geofencing perusahaan.</p>
        </div>

        <!-- Camera View Area -->
        <div class="relative overflow-hidden rounded-2xl bg-slate-900 aspect-video mb-6 shadow-inner border border-slate-200">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-sm text-white text-[10px] px-3 py-1.5 rounded-full font-medium tracking-wide">
                📷 LIVE FACE DETECTION WORKING
            </div>
        </div>

        <!-- Info Kordinat Live -->
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 mb-6 flex flex-col gap-1.5">
            <div class="flex justify-between text-xs text-slate-500">
                <span>Latitude:</span>
                <span id="lat-display" class="font-mono text-slate-800 font-semibold">-</span>
            </div>
            <div class="flex justify-between text-xs text-slate-500">
                <span>Longitude:</span>
                <span id="long-display" class="font-mono text-slate-800 font-semibold">-</span>
            </div>
        </div>

        <!-- Action Button dengan Ripple Effect Emulator -->
        <button id="btn-absent" onclick="performCheckIn()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-semibold py-4 rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
            Masuk Kerja (Check In)
        </button>
        
        <p id="response-msg" class="text-center mt-4 text-sm font-medium hidden"></p>
    </div>

    <!-- Web Camera & Geolocation Scripts Integration -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        let currentLat = null;
        let currentLong = null;

        // Mendapatkan Hak Akses Kamera saat Halaman Dimuat
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("Akses Kamera Ditolak:", err); alert("Aplikasi membutuhkan izin kamera untuk absensi."); });

        // Mendapatkan Lokasi Real-time secara Kontinu (HTML5 Geolocation)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLong = position.coords.longitude;
                    document.getElementById('lat-display').innerText = currentLat.toFixed(6);
                    document.getElementById('long-display').innerText = currentLong.toFixed(6);
                },
                (err) => { console.error("Gagal mendapatkan lokasi:", err); },
                { enableHighAccuracy: true } // Memaksa browser menggunakan GPS presisi tinggi
            );
        }

        function performCheckIn() {
            if (!currentLat || !currentLong) {
                alert("Sedang mengunci koordinat GPS, mohon tunggu sebentar...");
                return;
            }

            // Ambil snapshot gambar wajah dari elemen Video ke Canvas
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const photoBase64 = canvas.toDataURL('image/png');

            const responseMsg = document.getElementById('response-msg');
            responseMsg.classList.remove('hidden');
            responseMsg.className = "text-center mt-4 text-sm font-medium text-blue-600 animate-pulse";
            responseMsg.innerText = "Memproses absensi ke server...";

            // Kirim Data JSON ke REST API Flask
            // *Catatan: Token disimpan di LocalStorage/Cookie saat proses login
            const token = localStorage.getItem('access_token'); 

            fetch('/api/v1/attendance/check-in', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    latitude: currentLat,
                    longitude: currentLong,
                    photo: photoBase64
                })
            })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(res => {
                if (res.status === 200) {
                    responseMsg.className = "text-center mt-4 text-sm font-medium text-emerald-600";
                    responseMsg.innerText = `${res.body.message} (${res.body.data.status_kehadiran})`;
                } else {
                    responseMsg.className = "text-center mt-4 text-sm font-medium text-rose-600";
                    responseMsg.innerText = `Gagal: ${res.body.message}`;
                }
            })
            .catch(err => {
                responseMsg.className = "text-center mt-4 text-sm font-medium text-rose-600";
                responseMsg.innerText = "Koneksi ke server terputus.";
            });
        }
    </script>
</body>
</html>
