<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laporan Kerja Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }</style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-6 border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Laporan Harian</h2>
        <form onsubmit="submitReport(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Tugas / Aktivitas Hari Ini</label>
                <input type="text" id="title" required class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Misal: Meeting Klien A">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Deskripsi Pekerjaan</label>
                <textarea id="desc" rows="4" required class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Rincian hasil kerja..."></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all">Kirim Laporan</button>
            <button type="button" onclick="window.location.href='/dashboard'" class="w-full bg-slate-100 text-slate-700 font-semibold py-3 rounded-xl mt-3">Batal</button>
        </form>
    </div>

    <script>
        async function submitReport(e) {
            e.preventDefault();
            const token = localStorage.getItem('access_token');
            const data = { title: document.getElementById('title').value, description: document.getElementById('desc').value };
            
            const res = await fetch('/api/v1/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('Laporan berhasil dikirim!');
                window.location.href = '/dashboard';
            }
        }
    </script>
</body>
</html>
