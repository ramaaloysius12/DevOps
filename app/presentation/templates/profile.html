<!-- app/templates/profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital ID Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; } /* Dark Mode Base */
        .id-card {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Digital ID Card Container -->
    <div class="id-card w-full max-w-sm rounded-3xl overflow-hidden relative">
        <!-- Accent Line -->
        <div class="h-2 w-full bg-gradient-to-r from-blue-500 via-cyan-400 to-emerald-400"></div>
        
        <div class="p-8 flex flex-col items-center">
            <!-- Company Logo / Name -->
            <div class="text-blue-400 font-bold tracking-widest text-sm mb-6 uppercase">PT. Tech Enterprise</div>
            
            <!-- Profile Photo -->
            <div class="w-32 h-32 rounded-full border-4 border-slate-700 overflow-hidden mb-5 relative shadow-xl">
                <img id="ui-avatar" src="https://ui-avatars.com/api/?name=Loading&background=2563EB&color=fff&size=128" class="w-full h-full object-cover">
            </div>

            <!-- Employee Details -->
            <h2 id="emp-name" class="text-2xl font-bold text-white mb-1">Memuat...</h2>
            <p id="emp-position" class="text-cyan-400 font-medium mb-1">-</p>
            <p id="emp-department" class="text-slate-400 text-sm mb-6">-</p>

            <!-- Divider -->
            <div class="w-full h-px bg-slate-700/50 mb-6"></div>

            <!-- QR Code Area (Digunakan untuk tap mesin absensi fisik / validasi HR) -->
            <div class="bg-white p-3 rounded-xl mb-4">
                <div id="qrcode"></div>
            </div>
            <p id="emp-nik" class="text-slate-400 font-mono text-sm tracking-widest">-</p>
        </div>
    </div>

    <script>
        // Fetch data profil saat halaman dimuat
        async function loadProfile() {
            const token = localStorage.getItem('access_token');
            if(!token) return window.location.href = '/login';

            const response = await fetch('/api/v1/profile/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const res = await response.json();
                const data = res.data;
                
                document.getElementById('emp-name').innerText = data.full_name;
                document.getElementById('emp-position').innerText = data.position;
                document.getElementById('emp-department').innerText = data.department;
                document.getElementById('emp-nik').innerText = data.nik;
                document.getElementById('ui-avatar').src = `https://ui-avatars.com/api/?name=${data.full_name.replace(' ', '+')}&background=2563EB&color=fff&size=128`;

                // Generate QR Code berisi NIK untuk tapping
                new QRCode(document.getElementById("qrcode"), {
                    text: data.nik,
                    width: 100,
                    height: 100,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff"
                });
            }
        }
        loadProfile();
    </script>
</body>
</html>
